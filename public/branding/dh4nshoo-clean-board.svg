<svg width="1600" height="1180" viewBox="0 0 1600 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1180" fill="#ECE7DB"/>
  <text x="82" y="114" fill="#121212" font-family="Anton, Arial, sans-serif" font-size="92" letter-spacing="8">DH4NSHOO / CLEAN GEN Z DIRECTIONS</text>
  <text x="84" y="170" fill="#555555" font-family="Space Grotesk, Arial, sans-serif" font-size="28" letter-spacing="4">Less messy, more brandable. The 4 stays important, but the mark feels cleaner.</text>

  <rect x="80" y="228" width="1440" height="250" rx="20" fill="#F7F3EA" stroke="#D6CFBF" stroke-width="2"/>
  <text x="144" y="368" fill="#121212" font-family="Anton, Arial, sans-serif" font-size="142" letter-spacing="16">DH4NSHOO</text>
  <rect x="470" y="252" width="52" height="52" rx="8" fill="#C7FF3D"/>
  <text x="112" y="278" fill="#555555" font-family="Space Grotesk, Arial, sans-serif" font-size="24" letter-spacing="5">01 / MONO CLEAN</text>
  <text x="112" y="428" fill="#555555" font-family="Space Grotesk, Arial, sans-serif" font-size="24" letter-spacing="5">Best for a minimal streetwear label with broad use across site, tags, and tees</text>

  <rect x="80" y="506" width="1440" height="250" rx="20" fill="#121212"/>
  <text x="136" y="650" fill="#F7F3EA" font-family="Anton, Arial, sans-serif" font-size="144" letter-spacing="18">DH4NSHOO</text>
  <path d="M142 674H1002" stroke="#C7FF3D" stroke-width="10"/>
  <path d="M470 536L438 632H504L470 536Z" fill="#C7FF3D"/>
  <text x="112" y="556" fill="#A0A0A0" font-family="Space Grotesk, Arial, sans-serif" font-size="24" letter-spacing="5">02 / CUT LINE</text>
  <text x="112" y="708" fill="#A0A0A0" font-family="Space Grotesk, Arial, sans-serif" font-size="24" letter-spacing="5">Best if you want cleaner branding but still some attitude and motion</text>

  <rect x="80" y="784" width="1440" height="300" rx="20" fill="#F7F3EA" stroke="#D6CFBF" stroke-width="2"/>
  <text x="148" y="946" fill="#121212" font-family="Anton, Arial, sans-serif" font-size="144" letter-spacing="16">DH</text>
  <rect x="392" y="820" width="104" height="104" rx="12" fill="#121212"/>
  <text x="420" y="896" fill="#C7FF3D" font-family="Anton, Arial, sans-serif" font-size="82">4</text>
  <text x="520" y="946" fill="#121212" font-family="Anton, Arial, sans-serif" font-size="144" letter-spacing="16">NSHOO</text>
  <rect x="148" y="972" width="934" height="4" fill="#121212"/>
  <text x="112" y="836" fill="#555555" font-family="Space Grotesk, Arial, sans-serif" font-size="24" letter-spacing="5">03 / OFFSET ICON</text>
  <text x="112" y="1038" fill="#555555" font-family="Space Grotesk, Arial, sans-serif" font-size="24" letter-spacing="5">Best if you want the 4 to become the identity symbol with only one clean appearance</text>
